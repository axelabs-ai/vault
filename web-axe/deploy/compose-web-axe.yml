# /opt/axe/vault/docker-compose.yml 의 services: 아래에 추가된 조각 (실제 배포된 형태).
#
# 이미지가 아니라 bind mount 인 이유: 레지스트리를 새로 세울 필요가 없고 롤백이
# "이전 dist 를 되돌려 놓고 restart" 로 끝난다. 정적 파일 11MB 를 위해 이미지 태그
# 수명주기를 하나 더 만들 이유가 없다.
#
# ⚠️ 디렉터리를 마운트한다 (단일 파일 아님). 단일 파일 bind mount 는 inode 를 묶기
# 때문에, 나중에 conf 를 에디터로 다시 쓰면 새 inode 가 생겨 컨테이너가 옛 파일에
# 고착된다. 디렉터리 마운트는 그 함정을 원천 차단한다.
#
# ⚠️ 같은 이유로 web-axe-dist **디렉터리 자체를 mv 로 교체하지 말 것** — 마운트가
# 옛 inode 에 묶인다. 재배포는 디렉터리 *내용*을 rsync --delete 로 갱신한다
# (DEPLOY.md 6절). 파일명이 content-hash 라 새 파일 추가 → index.html 교체 순서로
# 무중단이다.
services:
  web-axe:
    image: nginx:alpine
    container_name: web-axe
    restart: unless-stopped
    volumes:
      # 2026-08-14 컷오버로 dist 가 루트에 붙는다 (이전에는 .../html/axe).
      - /opt/axe/vault/web-axe-dist:/usr/share/nginx/html:ro
      - /opt/axe/vault/web-axe-nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/axe/vault/web-axe-nginx/snippets:/etc/nginx/snippets:ro
    # 호스트 포트를 열지 않는다 — cloudflared 가 vault_default 네트워크 안에서
    # http://web-axe:80 으로 직접 붙는다.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:80/"]
      interval: 30s
      retries: 5
      start_period: 10s
