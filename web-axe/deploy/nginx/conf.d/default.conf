# AXE Vault (web-axe) 정적 서빙 — https://vault.axelabs.ai/ (루트)
#
# 2026-08-14 컷오버: 루트가 이 앱이 됐다. 스톡 web-vault 는 vault-classic.axelabs.ai 로
# 옮겨졌다 (같은 vaultwarden 컨테이너, 다른 호스트명).
#
# ⚠️ 이 컨테이너는 **앱이 소유한 경로만** 받는다. cloudflared ingress 가 allowlist 로
# 걸러 준다: `^/(|index\.html|assets/.*)$` + 하위호환 `^/axe(/.*)?$`. 그 외 전부
# (/api · /identity · /notifications · /icons · /attachments · /admin · /css · /vw_static ·
# /sso-connector.html · /.well-known · /app · /images · 루트 해시 파일 …)는 규칙에 안 걸려
# 기존 vaultwarden 으로 흘러간다. **열거가 아니라 폴백이 기본값**이라, 우리가 미처 생각
# 못 한 서버 경로가 있어도 그건 여전히 vaultwarden 이 받는다 (DEPLOY.md 2절).
#
# 앱이 치는 API 는 `location.origin` 기준이라 결국 같은 오리진의 vaultwarden 으로 간다.
# CORS 가 발생할 여지가 구조적으로 없다.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # dist/ 가 /usr/share/nginx/html 에 read-only 로 마운트된다 (컷오버 전에는 .../html/axe).
    # SPA 라우팅이 없어(단일 진입점) try_files fallback 이 필요 없다.
    root /usr/share/nginx/html;
    index index.html;

    # 빌드 때 만들어 둔 .gz 를 그대로 낸다 — 7.5MB wasm 을 매 요청 압축하는 낭비를 없앤다.
    # ⚠️ brotli_static 은 쓰지 않는다: 공식 nginx:alpine 에 모듈이 없어 그 지시어
    # 하나가 기동 자체를 깬다 (DEPLOY.md 4절).
    gzip_static on;
    gzip_vary on;

    # 프록시 뒤에서 디렉터리 리다이렉트가 http:// 절대 URL 을 뱉으면 혼합 콘텐츠가 된다.
    absolute_redirect off;

    # Content-Type: application/wasm 은 nginx 1.31 의 mime.types 에 이미 있다
    # (실측 2026-08-14: mime.types:55). 틀리면 WebAssembly.instantiateStreaming 이
    # 스트리밍 컴파일을 포기하므로, 베이스 이미지를 올릴 때 재확인할 항목이다.

    # ⚠️ add_header 상속 함정: location 에 add_header 가 하나라도 있으면 상위 레벨의
    # add_header 는 **전부** 상속되지 않는다. 그래서 보안 헤더를 스니펫으로 빼고,
    # add_header 를 쓰는 모든 location 에서 다시 include 한다. 이 함정은 설정이 조용히
    # 통과하고 헤더만 사라지므로 배포 후 curl -sI 로 실측해야 한다.
    include /etc/nginx/snippets/axe-security-headers.conf;

    # 진입점 — 해시가 없는 유일한 파일이라 항상 재검증해 새 번들 해시를 집어야 한다.
    location = / {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # content-hash 파일명(js·css·woff2·wasm) → 내용이 바뀌면 이름이 바뀐다.
    # 무효화 절차가 따로 없고, 재방문 시 네트워크 0 이다.
    location /assets/ {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 하위호환 — 컷오버 전 진입점이던 /axe/. 같은 index 를 낸다.
    # 번들이 base=/ 로 빌드돼 자산은 /assets/ 를 가리키므로 여기서 열어도 정상 동작한다.
    location = /axe/ {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /axe {
        return 301 /axe/;
    }

    # allowlist 밖은 애초에 여기 도달하지 않는다 (ingress 가 vaultwarden 으로 보낸다).
    # 실수로 도달하면 조용히 404.
    location / {
        return 404;
    }
}
