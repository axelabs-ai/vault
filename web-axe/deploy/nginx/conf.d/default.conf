# AXE Vault (web-axe) 정적 서빙 — https://vault.axelabs.ai/axe/*
#
# cloudflared ingress 가 ^/axe(/.*)?$ 만 이 컨테이너로 보낸다. 나머지(/ · /identity ·
# /api · /notifications)는 기존 vaultwarden 이 그대로 받는다 — 이 설정은 스톡 볼트의
# 어떤 경로도 가로채지 않는다.
#
# 앱이 치는 API(/identity·/api)는 이 프리픽스 **밖**이라 같은 오리진의 vaultwarden 으로
# 간다. 그래서 CORS 가 아예 발생하지 않는다 (DEPLOY.md 1절).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # dist/ 가 /usr/share/nginx/html/axe 에 read-only 로 마운트된다 → /axe/* 가 그대로
    # 파일 경로에 매핑된다. SPA 라우팅이 없어(단일 진입점) try_files fallback 이 없다.
    root /usr/share/nginx/html;
    index index.html;

    # 빌드 때 만들어 둔 .gz 를 그대로 낸다 — 7.5MB wasm 을 매 요청 압축하는 낭비를 없앤다.
    # ⚠️ brotli_static 은 쓰지 않는다: 공식 nginx:alpine 에 brotli 모듈이 없어 그 지시어
    # 하나가 기동 자체를 깬다 (DEPLOY.md 4절).
    gzip_static on;
    gzip_vary on;

    # 프록시 뒤에서 디렉터리 리다이렉트가 http:// 절대 URL 을 뱉으면 혼합 콘텐츠가 된다.
    absolute_redirect off;

    # Content-Type: application/wasm 은 nginx 1.31 의 mime.types 에 이미 있다
    # (실측 2026-08-14: mime.types:55). 틀리면 WebAssembly.instantiateStreaming 이
    # 스트리밍 컴파일을 포기하므로, 베이스 이미지를 올릴 때 재확인할 항목이다.

    # ⚠️ add_header 상속 함정: location 에 add_header 가 하나라도 있으면 상위 레벨의
    # add_header 는 **전부** 상속되지 않는다. 그래서 보안 헤더를 스니펫으로 빼고,
    # add_header 를 쓰는 모든 location 에서 다시 include 한다. 이 함정은 설정이 조용히
    # 통과하고 헤더만 사라지므로 배포 후 curl -sI 로 세 경로를 실측해야 한다.
    include /etc/nginx/snippets/axe-security-headers.conf;

    # 해시가 없는 유일한 파일 — 항상 재검증해 새 번들 해시를 집어야 한다.
    location = /axe/index.html {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # content-hash 파일명(js·css·woff2·wasm) → 내용이 바뀌면 이름이 바뀐다.
    # 무효화 절차가 따로 없고, 재방문 시 네트워크 0 이다.
    location /axe/assets/ {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # /axe/ 자신(index 로 index.html 을 낸다). assets 보다 짧은 프리픽스라 위 블록이 우선한다.
    location /axe/ {
        include /etc/nginx/snippets/axe-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 슬래시 없는 /axe → /axe/ (absolute_redirect off 라 상대 경로로 나간다).
    location = /axe {
        return 301 /axe/;
    }

    # 이 컨테이너는 /axe/* 외의 트래픽을 받지 않는다. 실수로 도달하면 조용히 404.
    location / {
        return 404;
    }
}
