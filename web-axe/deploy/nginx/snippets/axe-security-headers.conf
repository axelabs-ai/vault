# AXE Vault 보안 헤더 — 1선 방어선 (DEPLOY.md 5절).
#
# index.html 의 <meta http-equiv="Content-Security-Policy"> 는 2선이다. meta 는
# frame-ancestors 를 지원하지 않으므로 클릭재킹을 막는 건 오직 아래 헤더다.
#
# ⚠️ 이 파일은 add_header 를 쓰는 **모든** location 에서 다시 include 해야 한다.
# nginx 는 location 에 add_header 가 하나라도 있으면 상위 레벨의 add_header 를
# 통째로 상속하지 않는다 — 캐시 헤더만 추가한 location 은 조용히 보안 헤더를 전부 잃는다.

# 'wasm-unsafe-eval' 은 뺄 수 없다 — 없으면 크립토가 통째로 죽는다.
# 'unsafe-inline' 이 script-src 에 없는 건 빌드 산출물에 인라인 <script> 가 0 개이기 때문
# (build.modulePreload.polyfill = false). style-src 의 'unsafe-inline' 은 React 의
# 인라인 style 속성 때문에 남아 있다 — 걷어내면 뺄 수 있다(하드닝 항목).
# connect-src 'self' 가 이 앱의 성질을 못박는다: 자기 오리진(=금고 서버) 밖으로 나가지 않는다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
