name: vault

services:
  vaultwarden:
    # Official upstream — fork 졸업 (2026-06-13). timshel SSO fork 가 본가 합류:
    # 1.35.0 SSO 네이티브, 1.35.5 sync UserDecryption, 1.36.0 prelogin/password.
    # 구 axe 패치 2건 (30835e9b, ab685324) 모두 본가 포함 → 패치 불필요.
    # 롤백: image 를 axelabs-ai/vault:1.34.1-6-axe.2 로 되돌리고
    # data 를 data.bak.20260613-preupgrade 에서 복원 (DB 마이그레이션 비가역).
    # 주의: ORGANIZATION_INVITE_AUTO_ACCEPT 는 timshel 전용 — 본가엔 없어 무시됨.
    image: vaultwarden/server:1.36.0
    container_name: vault-app
    restart: unless-stopped
    # Secrets (ADMIN_TOKEN, DOMAIN, SIGNUPS_ALLOWED) injected from this file.
    # The argon2 hash contains '$' chars — env_file avoids compose interpolation.
    env_file:
      - ${VAULT_ENV_FILE:-./env.local}
    environment:
      WEBSOCKET_ENABLED: "true"
      SENDS_ALLOWED: "true"
      EMERGENCY_ACCESS_ALLOWED: "true"
      LOG_FILE: /data/vaultwarden.log
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "true"
      EVENTS_DAYS_RETAIN: "90"
      TZ: Asia/Seoul
    volumes:
      - ./data:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/vault/alive"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: vault-caddy
    restart: unless-stopped
    depends_on:
      - vaultwarden
    ports:
      - "127.0.0.1:8222:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data

  # MCP layer (라운드 11, 2026-05-13)
  # 부트스트랩 §1.2·§8.1 결정(vault MCP 미노출)을 운영 통일성 요구로 우회.
  # 보안 가드: 비밀번호 본문 절대 미반환, 메타데이터만 노출, Bearer 인증,
  # 전 호출 audit log. SoT 스펙: vault/mcp/Dockerfile + vault_mcp/server.py.
  mcp:
    image: vault-mcp:latest
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: vault-mcp
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    env_file:
      - ${VAULT_MCP_ENV_FILE:-/Users/realchoice/.config/truvia/vault-mcp.env}
    environment:
      VAULT_MCP_TRANSPORT: sse
      VAULT_MCP_HTTP_HOST: 0.0.0.0
      VAULT_MCP_HTTP_PORT: "8772"
      # /vault 서브패스 필수 — DOMAIN=https://realchoice.axelabs.ai/vault 로 변경되며
      # Vaultwarden routes 가 /vault 아래 mount 됨. 서브패스 누락 시 bw ServerConfig 404
      # (in-memory 세션이 마스킹하다 2026-06-13 1.36.0 재기동으로 노출). L5b 진단.
      BW_SERVER_URL: https://vault-caddy:443/vault
      VAULT_LOG_DIR: /app/logs
      VAULT_OWNER_PASSWORD_FILE: /run/secrets/vault_master_password
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8772:8772"
    volumes:
      - ${HOME}/realchoice-ssot/logs:/app/logs
      - ${HOME}/backups/vault:/backups:ro
      - ${HOME}/.config/vault/MASTER_PASSWORD_INITIAL:/run/secrets/vault_master_password:ro  # pragma: allowlist secret
    # bw 세션 liveness 헬스 — /healthz 가 세션 죽으면 503 → 컨테이너 unhealthy.
    # uvicorn liveness 만으론 bw 세션 사망을 못 잡던 사각지대를 메움 (L5b, 2026-06-13).
    # 가벼운 bw status 점검 (sync 없음); 서버 도달성 deep 검증은 10분 헬스 프로브 몫.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8772/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  # L2-1 + L2-2 + L3-1 + L3-2 uplift (2026-05-12)
  # Absorbs the two host LaunchAgents (com.realchoice.vault-backup, vault-health)
  # into a supercronic-driven container that follows the stream-level pattern.
  # Trade-off: mounts /var/run/docker.sock to call `docker exec vault-app
  # /vaultwarden backup`. Image is minimal alpine — no shell exposed beyond
  # supercronic + our 5 job scripts. See vault/cron/Dockerfile.
  cron:
    image: vault-cron:latest
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: vault-cron
    restart: unless-stopped
    depends_on:
      vaultwarden:
        condition: service_healthy
    environment:
      VAULT_CONTAINER: vault-app
      VAULT_CADDY: vault-caddy
      VAULT_MCP: vault-mcp
      VAULT_GPG_RECIPIENT: vault-backup@realchoice.co.kr
      VAULT_BACKUP_DIR: /backups
      VAULT_LOG_DIR: /logs
      VAULT_BACKUP_RETAIN_DAYS: "30"
      VAULT_HEALTH_LOG_RETAIN_DAYS: "7"
      TZ: Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/backups/vault:/backups
      - ${HOME}/realchoice-ssot/logs:/logs
      - ./data:/vault-data:ro
    deploy:
      resources:
        limits:
          memory: 128M
